<!DOCTYPE html>
<html>
    <head>
        <title>Admin Dashboard</title>
    </head>
    <body>
        <h1>Welcome to the Admin Dashboard</h1>

        <p id="welcome_message">Welcome, {{ logged_User }}</p>

        <button id="logout">Log Out</button>

        <h2>Patient Records</h2>
        <button id="refresh_patients">Refresh patient records</button>

        <p id="status_message">Patients will be loaded here</p>
        <table>
            <thead>
                <tr>
                    <th>PatientID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                </tr>
            </thead>
            <tbody id="table_body">

            </tbody>
        </table>
        <script src="{{ url_for('static', filename='js/admin_dashboard.js') }}"></script>
    </body>
</html>
