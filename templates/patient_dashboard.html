<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
</head>
<body>
    <h1>Patient Dashboard</h1>
    <p>Welcome {{ logged_User  }}!</p>
    <button id="logout">Log out</button>

    <p>My Record</p>        
    <p id="status_message">Information will be loaded here</p>
    <button id="refresh_patients">Refresh information</button>

    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>                    
                <th>Update</th>
            </tr>
        </thead>
        <tbody id="table_body">
        </tbody>
    </table>

    <script src="{{ url_for('static', filename='js/patient_dashboard.js') }}"></script>

</body>
</html>
