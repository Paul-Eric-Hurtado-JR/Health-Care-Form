<!DOCTYPE html>
<html>
    <head>
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <title>Patient Update</title>
    </head>
    <body>
        <div class="form">
            <h1>Update patient information</h1>
            <form id="patient_form">
                <label for="patient_fname" >First Name: </label>
                <input type="text" id="patient_fname" name="fname" required><br><br>
            
                <label for="patient_lname">Last Name: </label>
                <input type="text" id="patient_lname" name="lname" required><br><br>
            
                <label for="patient_age">Age: </label>
                <input type="number" id="patient_age" name="age" min="0" max="105" step="1" required><br><br>

                <button type="submit" id="submit_button">Submit Info</button>
            </form>
            <button id="back_to_patient_dashboard">Back to Patient Dashboard</button>
            <p id="status_message"></p>
        </div>
        <script src="{{ url_for('static', filename='js/patient_update.js') }}"></script>
    </body>
</html>
