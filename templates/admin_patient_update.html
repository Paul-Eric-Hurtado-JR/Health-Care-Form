<!DOCTYPE html>
<html>
    <head>
        <meta name="csrf-token" content="{{ csrf_token() }}">
        <title>Patient Update</title>
    </head>
    <body>
        <div class="form">
            <h1>Update Patient Page</h1>
            <form id="patient_form">
                <label for="patient_fname" >First Name: </label>
                <input type="text" id="patient_fname" name="fname"><br><br>
            
                <label for="patient_lname">Last Name: </label>
                <input type="text" id="patient_lname" name="lname"><br><br>
            
                <label for="patient_age">Age: </label>
                <input type="number" id="patient_age" name="age"><br><br>

                <button type="submit">Submit Info</button>
                <p id="message"></p>
            </form>
            <button id="back_to_admin_dashboard">Back to Admin Dashboard</button>
            <p id="status_message"></p>
        </div>
        <script>const patient_ID = {{ patient_id }};</script>
        <script src="{{ url_for('static', filename='js/admin_patient_update.js') }}"></script>
    </body>
<html>
